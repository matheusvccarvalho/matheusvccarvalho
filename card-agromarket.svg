<text x="44" y="144" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#c3cfc0">REST API and web dashboard for agricultural price quotes:</text><text x="44" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#c3cfc0">CSV import, price indicators, history and variation,</text><text x="44" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#c3cfc0">in a layered Spring Boot backend. Initial data: Paraná soybeans.</text><rect x="44" y="222" width="64" height="30" rx="15" fill="#16221a" stroke="#2E5A34" stroke-width="1.5"/><text x="76" y="242" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#dfead8">Java</text><rect x="118" y="222" width="129" height="30" rx="15" fill="#16221a" stroke="#2E5A34" stroke-width="1.5"/><text x="182" y="242" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#dfead8">Spring Boot</text><rect x="257" y="222" width="167" height="30" rx="15" fill="#16221a" stroke="#2E5A34" stroke-width="1.5"/><text x="340" y="242" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#dfead8">Spring Data JPA</text><rect x="434" y="222" width="73" height="30" rx="15" fill="#16221a" stroke="#2E5A34" stroke-width="1.5"/><text x="470" y="242" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#dfead8">MySQL</text><rect x="517" y="222" width="120" height="30" rx="15" fill="#16221a" stroke="#2E5A34" stroke-width="1.5"/><text x="577" y="242" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#dfead8">JavaScript</text>
