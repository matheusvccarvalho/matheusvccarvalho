<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Trator animado enviando telemetria simulada para um painel de BI">
  <title>AgroTech Visual Demo: trator com telemetria enviando dados para um painel de BI (simulação)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04120c"/>
      <stop offset="1" stop-color="#0b3b27"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="270" rx="16" fill="url(#sky)"/>
  <circle cx="700" cy="200" r="70" fill="url(#sun)">
    <animate attributeName="r" values="62;78;62" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Nuvens à deriva -->
  <g opacity="0.10" fill="#10B981">
    <animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="45s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="60" rx="60" ry="14"/>
    <ellipse cx="30" cy="52" rx="38" ry="12"/>
    <ellipse cx="-300" cy="110" rx="70" ry="12"/>
  </g>

  <!-- Colinas -->
  <path d="M0 218 Q 120 150 260 200 T 520 196 T 800 188 L800 230 L0 230Z" fill="#0a2e1f"/>
  <path d="M0 226 Q 200 186 400 216 T 800 208 L800 232 L0 232Z" fill="#0d3b28"/>

  <!-- Solo e fileiras de plantio em movimento -->
  <rect y="222" width="800" height="48" fill="#0b2a1d"/>
  <line x1="0" y1="222" x2="800" y2="222" stroke="#10B981" stroke-opacity="0.6" stroke-width="2"/>
  <g stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="0" y1="234" x2="800" y2="234" stroke-opacity="0.55" stroke-dasharray="18 14">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="244" x2="800" y2="244" stroke-opacity="0.40" stroke-dasharray="22 16">
      <animate attributeName="stroke-dashoffset" from="0" to="38" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="256" x2="800" y2="256" stroke-opacity="0.30" stroke-dasharray="26 18">
      <animate attributeName="stroke-dashoffset" from="0" to="44" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Canal de dados: trator -> painel -->
  <path d="M270 40 C 340 2 480 2 580 75" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="4" fill="#6ee7b7">
    <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M270 40 C 340 2 480 2 580 75"/>
  </circle>
  <circle r="4" fill="#6ee7b7">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M270 40 C 340 2 480 2 580 75"/>
  </circle>
  <circle r="4" fill="#6ee7b7">
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M270 40 C 340 2 480 2 580 75"/>
  </circle>

  <!-- Trator -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- Escapamento + fumaça -->
    <rect x="436" y="82" width="8" height="36" rx="2" fill="#087443"/>
    <circle cx="440" cy="80" r="3" fill="#a7f3d0" opacity="0.5">
      <animate attributeName="cy" values="80;42" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;10" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="80" r="3" fill="#a7f3d0" opacity="0.5">
      <animate attributeName="cy" values="80;42" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;10" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Chassi e capô -->
    <rect x="250" y="150" width="270" height="24" rx="6" fill="#087443"/>
    <polygon points="335,150 335,112 490,120 520,150" fill="#10B981"/>
    <rect x="345" y="124" width="110" height="5" rx="2" fill="#071B13" opacity="0.35"/>
    <rect x="345" y="134" width="110" height="5" rx="2" fill="#071B13" opacity="0.35"/>

    <!-- Cabine -->
    <rect x="215" y="70" width="110" height="82" rx="10" fill="#10B981"/>
    <rect x="228" y="82" width="84" height="50" rx="6" fill="#071B13" opacity="0.88"/>
    <rect x="205" y="62" width="130" height="10" rx="5" fill="#087443"/>

    <!-- Antena de telemetria -->
    <line x1="270" y1="62" x2="270" y2="42" stroke="#6ee7b7" stroke-width="3"/>
    <circle cx="270" cy="40" r="4" fill="#6ee7b7"/>
    <circle cx="270" cy="40" r="4" fill="none" stroke="#6ee7b7" stroke-width="2">
      <animate attributeName="r" values="4;18" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Farol -->
    <circle cx="514" cy="140" r="5" fill="#fde68a">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Roda traseira -->
    <g transform="translate(270 170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        <circle r="52" fill="#071B13"/>
        <circle r="48" fill="none" stroke="#10B981" stroke-width="9" stroke-dasharray="9 7"/>
        <circle r="36" fill="#0b3b27" stroke="#087443" stroke-width="3"/>
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#071B13" stroke-width="5"/>
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#071B13" stroke-width="5"/>
        <circle r="9" fill="#10B981"/>
      </g>
    </g>

    <!-- Roda dianteira -->
    <g transform="translate(470 190)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.23s" repeatCount="indefinite"/>
        <circle r="32" fill="#071B13"/>
        <circle r="29" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="7 6"/>
        <circle r="21" fill="#0b3b27" stroke="#087443" stroke-width="2"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#071B13" stroke-width="4"/>
        <line x1="0" y1="-20" x2="0" y2="20" stroke="#071B13" stroke-width="4"/>
        <circle r="6" fill="#10B981"/>
      </g>
    </g>
  </g>

  <!-- HUD de telemetria (simulação) -->
  <rect x="20" y="18" width="224" height="92" rx="10" fill="#04120c" fill-opacity="0.78" stroke="#10B981" stroke-opacity="0.45"/>
  <text x="34" y="38" font-family="monospace" font-size="11" fill="#6ee7b7">TELEMETRIA · TRATOR-01</text>
  <text x="34" y="100" font-family="monospace" font-size="8" fill="#10B981" fill-opacity="0.7">demo simulada, dados ilustrativos</text>

  <text x="34" y="58" font-family="monospace" font-size="9" fill="#a7f3d0">UMIDADE DO SOLO</text>
  <rect x="34" y="63" width="170" height="6" rx="3" fill="#0b3b27"/>
  <rect x="34" y="63" width="100" height="6" rx="3" fill="#10B981">
    <animate attributeName="width" values="100;140;115;100" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="34" y="84" font-family="monospace" font-size="9" fill="#a7f3d0">ROTAÇÃO DO MOTOR</text>
  <rect x="34" y="88" width="170" height="6" rx="3" fill="#0b3b27"/>
  <rect x="34" y="88" width="120" height="6" rx="3" fill="#34d399">
    <animate attributeName="width" values="120;90;150;120" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Painel de BI (simulação) -->
  <rect x="580" y="18" width="200" height="112" rx="10" fill="#04120c" fill-opacity="0.82" stroke="#10B981" stroke-opacity="0.45"/>
  <text x="594" y="38" font-family="monospace" font-size="11" fill="#6ee7b7">PAINEL DE BI · DEMO</text>
  <line x1="594" y1="116" x2="766" y2="116" stroke="#10B981" stroke-opacity="0.4"/>
  <rect x="598" y="86" width="24" height="30" rx="3" fill="#087443">
    <animate attributeName="height" values="30;56;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="86;60;86" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="632" y="66" width="24" height="50" rx="3" fill="#10B981">
    <animate attributeName="height" values="50;34;50" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="66;82;66" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="666" y="76" width="24" height="40" rx="3" fill="#087443">
    <animate attributeName="height" values="40;62;40" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="76;54;76" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="52" width="24" height="64" rx="3" fill="#34d399">
    <animate attributeName="height" values="64;44;64" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="52;72;52" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="734" y="70" width="24" height="46" rx="3" fill="#10B981">
    <animate attributeName="height" values="46;60;46" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="70;56;70" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
